[package]
name = "aurora-dict"
version = "1.2.1"
description = "A calm, fast bilingual desktop dictionary"
authors = ["Aurora Dictionary"]
edition = "2021"
rust-version = "1.77.2"
license = "PolyForm-Noncommercial-1.0.0"

[lib]
name = "aurora_dict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aurora-dict"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-system-fonts = "2.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "socks"] }
scraper = "0.20"
urlencoding = "2.1"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "time"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
