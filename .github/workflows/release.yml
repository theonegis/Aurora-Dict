name: Release desktop installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new release tag, for example v2.0.0"
        required: true
        default: "v2.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Create or reuse the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          case "$REQUESTED_TAG" in
            v*) ;;
            *) echo "Release tags must start with v (received: $REQUESTED_TAG)" >&2; exit 2 ;;
          esac
          APP_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [[ "$REQUESTED_TAG" == "v$APP_VERSION" ]] || {
            echo "Tag $REQUESTED_TAG does not match src-tauri/tauri.conf.json version $APP_VERSION." >&2
            exit 2
          }
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$PACKAGE_VERSION" == "$APP_VERSION" ]] || {
            echo "package.json version $PACKAGE_VERSION does not match Tauri version $APP_VERSION." >&2
            exit 2
          }
          CARGO_VERSION="$(awk -F'"' '
            /^\[package\]$/ { in_package = 1; next }
            /^\[/ { if (in_package) exit }
            in_package && /^version[[:space:]]*=/ { print $2; exit }
          ' src-tauri/Cargo.toml)"
          [[ "$CARGO_VERSION" == "$APP_VERSION" ]] || {
            echo "Cargo.toml version $CARGO_VERSION does not match Tauri version $APP_VERSION." >&2
            exit 2
          }

          if ! gh release view "$REQUESTED_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$REQUESTED_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Aurora Dict ${REQUESTED_TAG#v}" \
              --generate-notes \
              --draft
          fi

          release_id=""
          for attempt in {1..10}; do
            if release_id="$(gh release view "$REQUESTED_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json databaseId \
              --jq '.databaseId' 2>/dev/null)" \
              && [[ "$release_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            release_id=""
            echo "Waiting for release $REQUESTED_TAG to become available ($attempt/10)..."
            sleep 2
          done
          [[ -n "$release_id" ]] || {
            echo "Release $REQUESTED_TAG was created but its ID did not become available." >&2
            exit 1
          }
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS ${{ matrix.name }}
    needs: prepare-release
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            args: "--target aarch64-apple-darwin --bundles dmg"
            sidecar_target: aarch64-apple-darwin
          - name: x64
            args: "--target x86_64-apple-darwin --bundles dmg"
            sidecar_target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh ${{ matrix.sidecar_target }}
        env:
          AURORA_BUILD_LLAMA_FROM_SOURCE: "1"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ matrix.args }}
          uploadUpdaterJson: false
          releaseAssetNamePattern: "aurora-dict_[version]_[platform]_[arch]_[bundle][ext]"

  windows:
    name: Windows x64
    needs: prepare-release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh x86_64-pc-windows-msvc
        env:
          AURORA_BUILD_LLAMA_FROM_SOURCE: "1"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: "--bundles nsis"
          uploadUpdaterJson: false
          releaseAssetNamePattern: "aurora-dict_[version]_[platform]_[arch]_[bundle][ext]"

  linux:
    name: Linux deb and rpm
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm
      - run: npm ci
      - run: bash scripts/prepare-llama-sidecar.sh x86_64-unknown-linux-gnu
        env:
          AURORA_BUILD_LLAMA_FROM_SOURCE: "1"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: "--bundles deb,rpm"
          uploadUpdaterJson: false
          releaseAssetNamePattern: "aurora-dict_[version]_[platform]_[arch]_[bundle][ext]"

  publish-release:
    name: Publish completed release
    needs:
      - prepare-release
      - macos
      - windows
      - linux
    runs-on: ubuntu-22.04
    steps:
      - name: Publish the draft after every installer succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')"
          if [[ "$is_draft" == "true" ]]; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --latest
          fi
